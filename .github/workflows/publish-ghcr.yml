name: Publish GHCR Images

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Immutable image tag to publish, for example v0.1.0
        required: true
        type: string

env:
  REGISTRY: ghcr.io

# Serialize runs per ref without cancellation: every push still publishes its
# immutable develop-<sha> tag, and the newest run always moves the mutable
# channel alias last, so the alias cannot end up on a stale image after a race.
concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve build metadata
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      docs_only: ${{ steps.changed-paths.outputs.docs_only }}
      owner: ${{ steps.vars.outputs.owner }}
      version: ${{ steps.vars.outputs.version }}
      app_env: ${{ steps.vars.outputs.app_env }}
      extra_tag: ${{ steps.vars.outputs.extra_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: changed-paths
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$GITHUB_REF" in
            refs/heads/develop|refs/heads/main) ;;
            *)
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          elif git cat-file -e "$before" 2>/dev/null; then
            changed_files="$(git diff --name-only "$before" "$GITHUB_SHA")"
          else
            # Force-pushed over the previous tip; the base is gone, so build everything.
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$changed_files" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docs_only=true
          while IFS= read -r path; do
            case "$path" in
              apps/docs/*|.agent-guidance/*|*.md|*.mdx)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: Resolve image metadata
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          app_env="production"
          if [ "${GITHUB_REF_TYPE:-}" = "branch" ] && [ "${GITHUB_REF_NAME:-}" = "develop" ]; then
            app_env="preview"
          fi

          # Every build publishes one immutable tag (develop-<sha>, main-<sha>,
          # or v*). Branch and release builds additionally move a mutable
          # channel alias (develop, main, latest) so deployments can track a
          # channel without editing image references on every build. Manual
          # dispatch publishes no alias, so re-publishing an old version never
          # moves a channel backwards.
          extra_tag=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE:-}" = "branch" ] && [ "${GITHUB_REF_NAME:-}" = "develop" ]; then
            version="develop-${GITHUB_SHA:0:8}"
            extra_tag="develop"
          elif [ "${GITHUB_REF_TYPE:-}" = "branch" ] && [ "${GITHUB_REF_NAME:-}" = "main" ]; then
            version="main-${GITHUB_SHA:0:8}"
            extra_tag="main"
          else
            version="${GITHUB_REF_NAME:-}"
            extra_tag="latest"
          fi

          case "$version" in
            latest|develop|main|'')
              echo "Refusing to publish mutable or empty version tag: $version" >&2
              exit 1
              ;;
          esac
          case "$version" in
            *[!A-Za-z0-9._-]*)
              echo "Refusing to publish invalid image tag: $version" >&2
              exit 1
              ;;
          esac

          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "app_env=$app_env" >> "$GITHUB_OUTPUT"
          echo "extra_tag=$extra_tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.app }} (${{ matrix.arch }})
    needs: prepare
    if: ${{ needs.prepare.outputs.docs_only != 'true' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # Each arch builds natively (no QEMU: rustc segfaults under emulation,
      # rust-lang/rust#147026) and pushes by digest; the merge job below
      # assembles the digests into one multi-arch manifest per image.
      matrix:
        include:
          - app: app
            dockerfile: .docker/app/Dockerfile
            image: roomote-app
            arch: amd64
            runner: blacksmith-4vcpu-ubuntu-2404
          - app: app
            dockerfile: .docker/app/Dockerfile
            image: roomote-app
            arch: arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          - app: worker
            dockerfile: apps/worker/Dockerfile
            image: roomote-worker
            arch: amd64
            runner: blacksmith-4vcpu-ubuntu-2404
          - app: worker
            dockerfile: apps/worker/Dockerfile
            image: roomote-worker
            arch: arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Blacksmith's builder mounts a persistent NVMe layer cache into the
      # runner (per repo/Dockerfile/arch). Unlike type=gha caching this has
      # no 10GB repo cap or per-ref scoping, and skips the multi-minute
      # cache export upload at the end of every build.
      - name: Set up Docker builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app }} (${{ matrix.arch }}) by digest
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_ENV=${{ needs.prepare.outputs.app_env }}
            RELEASE_VERSION=${{ needs.prepare.outputs.version }}

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.app }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.app }} manifest
    needs: [prepare, build]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: app
            image: roomote-app
          - app: worker
            image: roomote-worker
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.app }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          EXTRA_TAG: ${{ needs.prepare.outputs.extra_tag }}
        run: |
          set -euo pipefail
          cd /tmp/digests

          tag_args=(-t "$IMAGE:$VERSION")
          if [ -n "$EXTRA_TAG" ]; then
            tag_args+=(-t "$IMAGE:$EXTRA_TAG")
          fi

          digest_refs=()
          for digest in *; do
            digest_refs+=("$IMAGE@sha256:$digest")
          done
          [ "${#digest_refs[@]}" -eq 2 ] || {
            echo "Expected 2 arch digests, found ${#digest_refs[@]}" >&2
            exit 1
          }

          docker buildx imagetools create "${tag_args[@]}" "${digest_refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  deploy-preview:
    name: Deploy preview
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: publish
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    environment: preview
    concurrency:
      group: preview-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve preview version
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          echo "version=develop-${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ROOMOTE_PREVIEW_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ vars.ROOMOTE_PREVIEW_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?ROOMOTE_PREVIEW_SSH_PRIVATE_KEY is required}"
          : "${KNOWN_HOSTS:?ROOMOTE_PREVIEW_KNOWN_HOSTS is required}"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/roomote-preview-deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/roomote-preview-deploy ~/.ssh/known_hosts

      - name: Upgrade preview deployment
        shell: bash
        env:
          ROOMOTE_PREVIEW_CUSTOMER: ${{ vars.ROOMOTE_PREVIEW_CUSTOMER }}
          ROOMOTE_PREVIEW_HOST: ${{ vars.ROOMOTE_PREVIEW_HOST }}
          ROOMOTE_PREVIEW_SSH_USER: ${{ vars.ROOMOTE_PREVIEW_SSH_USER }}
          ROOMOTE_IMAGE_RETENTION_RELEASES: ${{ vars.ROOMOTE_IMAGE_RETENTION_RELEASES || '3' }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          : "${ROOMOTE_PREVIEW_CUSTOMER:?ROOMOTE_PREVIEW_CUSTOMER is required}"
          : "${ROOMOTE_PREVIEW_HOST:?ROOMOTE_PREVIEW_HOST is required}"
          : "${VERSION:?version is required}"

          deploy/scripts/roomote-deploy upgrade \
            --customer "$ROOMOTE_PREVIEW_CUSTOMER" \
            --host "$ROOMOTE_PREVIEW_HOST" \
            --ssh-user "${ROOMOTE_PREVIEW_SSH_USER:-root}" \
            --ssh-private-key "$HOME/.ssh/roomote-preview-deploy" \
            --version "$VERSION"

  # Optional: keep a Railway deployment pinned to every develop build. The
  # job runs .github/scripts/railway-deploy.sh with an environment-scoped
  # project token: it finds every service in that one environment running
  # the roomote-app image, points it at the new immutable develop-<sha>
  # tag, and redeploys it. See deploy/railway/README.md for the runbook.
  deploy-railway:
    name: Deploy Railway preview
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: publish
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.ROOMOTE_RAILWAY_AUTODEPLOY == 'true' }}
    environment: railway
    concurrency:
      group: railway-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Point Railway services at the new image tag
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.ROOMOTE_RAILWAY_PROJECT_TOKEN }}
          RAILWAY_TOKEN_TYPE: project
        run: |
          set -euo pipefail
          : "${RAILWAY_TOKEN:?ROOMOTE_RAILWAY_PROJECT_TOKEN is required}"
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          export RAILWAY_IMAGE_PREFIX="ghcr.io/${owner}/roomote-app"
          export RAILWAY_IMAGE="${RAILWAY_IMAGE_PREFIX}:develop-${GITHUB_SHA:0:8}"
          .github/scripts/railway-deploy.sh

  # Optional: keep a fleet of main-channel Railway deployments pinned to
  # every main build. The job runs .github/scripts/railway-deploy.sh with a
  # workspace (team) token: it discovers every environment in that Railway
  # workspace with services running the roomote-app image, points them at
  # the new immutable main-<sha> tag, and redeploys them — deploying a new
  # customer into the workspace enrolls it with no CI change. When
  # ROOMOTE_RAILWAY_FLEET_CANARY names a project, that project deploys
  # first and a failure there aborts the rest of the fleet. See
  # deploy/railway/README.md for the runbook.
  deploy-railway-fleet:
    name: Deploy Railway fleet
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: publish
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ROOMOTE_RAILWAY_FLEET_AUTODEPLOY == 'true' }}
    environment: railway-fleet
    concurrency:
      group: railway-fleet-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy the fleet to the new image tag
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.ROOMOTE_RAILWAY_WORKSPACE_TOKEN }}
          RAILWAY_TOKEN_TYPE: workspace
          RAILWAY_CANARY_PROJECT: ${{ vars.ROOMOTE_RAILWAY_FLEET_CANARY }}
        run: |
          set -euo pipefail
          : "${RAILWAY_TOKEN:?ROOMOTE_RAILWAY_WORKSPACE_TOKEN is required}"
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          export RAILWAY_IMAGE_PREFIX="ghcr.io/${owner}/roomote-app"
          export RAILWAY_IMAGE="${RAILWAY_IMAGE_PREFIX}:main-${GITHUB_SHA:0:8}"
          .github/scripts/railway-deploy.sh
