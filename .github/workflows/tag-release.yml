name: Tag Product Release

on:
  push:
    branches:
      - main

concurrency:
  group: tag-product-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    name: Create v* tag
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Bot token so creating the tag triggers publish-ghcr.yml (GITHUB_TOKEN
          # pushes do not kick off other workflows).
          token: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Push annotated product tag when version is new
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          version="$(node -p "require('./package.json').version // ''")"
          if [ -z "$version" ]; then
            echo "No package.json version on main; skip."
            exit 0
          fi
          tag="v${version}"

          if git rev-parse "$tag" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "Tag $tag already exists; skip."
            exit 0
          fi

          git tag -a "$tag" -m "Roomote $tag"
          git push origin "refs/tags/$tag"
          echo "Pushed tag $tag"
          echo "GitHub Release is created by publish-ghcr.yml after roomote-app and roomote-worker images for this tag are published."
