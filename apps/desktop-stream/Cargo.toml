[package]
name = "roomote-desktop-stream"
version = "0.1.0"
edition = "2024"
license = "FCL-1.0-ALv2"
description = "Low-latency desktop video and audio streaming for Roomote sandboxes"

[dependencies]
async-stream = "0.3.6"
bytes = "1.10.1"
axum = { version = "0.8.7", features = ["http1", "json", "ws"] }
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.17", features = ["io"] }
x11rb = { version = "0.13.2", features = ["randr", "xtest"] }

[profile.release]
lto = "thin"
strip = true
