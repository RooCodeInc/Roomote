  PREVIEW_DOMAINS: ${ROOMOTE_PREVIEW_DOMAIN:?ROOMOTE_PREVIEW_DOMAIN is required}

x-roomote-service: &roomote-service
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:17.5
    profiles:
      - local-postgres
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomote-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-roomote}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-roomote}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    command: server /data --console-address ':9001'

  minio-init:
    image: minio/mc:latest
    restart: 'no'
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-roomote}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET_ARTIFACTS: ${S3_BUCKET_ARTIFACTS:-roomote-artifacts}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        until mc alias set roomote http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 1
        done
        mc mb --ignore-existing "roomote/$$S3_BUCKET_ARTIFACTS"

  # The only service with the host Docker socket. Its API is reachable solely
  # from the controller over an internal network, and all unrelated Docker API
  # sections remain denied by the proxy defaults.
  docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=4m,mode=755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: '1'
      ALLOW_START: '1'
      EXEC: '1'
      IMAGES: '1'
      NETWORKS: '1'
      POST: '1'
      EVENTS: '0'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]

  db-migrate:
    <<: *roomote-service
    image: *roomote-migrate-image
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    command: ['db-migrate']
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-production}
      ROOMOTE_DOCKER_LOAD_ENV_FILE: 'false'
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:roomote-postgres-password@postgres:5432/roomote}

  web:
    <<: *roomote-service
    image: *roomote-web-image
    command: ['web']
    depends_on:
      api:
        condition: service_started
    environment:
      <<: *roomote-web-env
      PORT: 3000
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /roomote/apps/web/.next/cache:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=700
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS --max-time 2 http://127.0.0.1:3000/health >/dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  api:
    <<: *roomote-service
    image: *roomote-api-image
    command: ['api']
    # Reachable from task worker containers (worker -> API over TRPC_URL).
    networks: [default, worker]
    depends_on:
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *roomote-api-env
      PORT: 3001
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS --max-time 2 http://127.0.0.1:3001/health/liveness >/dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  controller:
    <<: *roomote-service
    image: *roomote-controller-image
    command: ['controller']
    # Spawns and reaches task worker containers on the worker network.
    networks: [default, worker, docker-api]
    stop_grace_period: 7m
    depends_on:
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
      docker-proxy:
        condition: service_started
    environment:
      <<: *roomote-controller-env

  bullmq:
    <<: *roomote-service
    image: *roomote-bullmq-image
    command: ['bullmq']
    depends_on:
      redis:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *roomote-bullmq-env
      PORT: 3002

  preview-proxy:
    <<: *roomote-service
    image: *roomote-preview-proxy-image
    command: ['preview-proxy']
    # Proxies preview traffic into task worker containers.
    networks: [default, worker]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *roomote-preview-proxy-env
      PORT: 8081
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS --max-time 2 http://127.0.0.1:8081/health >/dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      preview-proxy:
        condition: service_healthy
    environment:
      ROOMOTE_APP_DOMAIN: ${ROOMOTE_APP_DOMAIN:?ROOMOTE_APP_DOMAIN is required}
      ROOMOTE_PREVIEW_DOMAIN: ${ROOMOTE_PREVIEW_DOMAIN:?ROOMOTE_PREVIEW_DOMAIN is required}
      S3_BUCKET_ARTIFACTS: ${S3_BUCKET_ARTIFACTS:-roomote-artifacts}
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  default:
    name: roomote_default
    driver: bridge
  # Task worker containers join only this network. It carries the API,
  # controller, and preview-proxy — everything a task needs to reach — but
  # not Postgres, Redis, or MinIO, so a task sandbox cannot reach the
  # datastores directly.
  worker:
    name: roomote_worker
    driver: bridge
  # No published ports and no route to application/datastore networks. Only
  # the controller and the socket proxy join this network.
  docker-api:
    name: roomote_docker_api
    driver: bridge
    internal: true
