name: roomote

# Compose's --env-file supplies interpolation values only. Application
# services intentionally do not use `env_file`: doing so would inject every
# deployment secret into every process before the explicit contracts below.
x-roomote-web-image: &roomote-web-image ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-roocodeinc}/roomote-web:${ROOMOTE_VERSION:?ROOMOTE_VERSION is required}
x-roomote-api-image: &roomote-api-image ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-roocodeinc}/roomote-api:${ROOMOTE_VERSION:?ROOMOTE_VERSION is required}
x-roomote-controller-image: &roomote-controller-image ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-roocodeinc}/roomote-controller:${ROOMOTE_VERSION:?ROOMOTE_VERSION is required}
x-roomote-bullmq-image: &roomote-bullmq-image ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-roocodeinc}/roomote-bullmq:${ROOMOTE_VERSION:?ROOMOTE_VERSION is required}
x-roomote-preview-proxy-image: &roomote-preview-proxy-image ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-roocodeinc}/roomote-preview-proxy:${ROOMOTE_VERSION:?ROOMOTE_VERSION is required}
x-roomote-migrate-image: &roomote-migrate-image ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-roocodeinc}/roomote-migrate:${ROOMOTE_VERSION:?ROOMOTE_VERSION is required}

x-roomote-base-env: &roomote-base-env
  NODE_ENV: production
  APP_ENV: ${APP_ENV:-production}
  ROOMOTE_DOCKER_LOAD_ENV_FILE: 'false'
  HOST: 0.0.0.0
  ROOMOTE_APP_URL: https://${ROOMOTE_APP_DOMAIN:?ROOMOTE_APP_DOMAIN is required}
  ROOMOTE_PUBLIC_URL: https://${ROOMOTE_APP_DOMAIN:?ROOMOTE_APP_DOMAIN is required}
  TRPC_URL: ${TRPC_URL:-https://${ROOMOTE_APP_DOMAIN:?ROOMOTE_APP_DOMAIN is required}/_roomote-api}

x-roomote-web-env: &roomote-web-env
  <<: *roomote-base-env
  DATABASE_URL: ${DATABASE_URL:-postgres://postgres:roomote-postgres-password@postgres:5432/roomote}
