name: roomote

# Compose's --env-file supplies interpolation values only. Application
# services intentionally do not use `env_file`: doing so would inject every
# deployment secret into every process before the explicit contracts below.
# Every control-plane service runs from the shared app image; the command and
# ROOMOTE_SERVICE select which service a container becomes, and the env
# contract for that service is enforced by packages/env.
x-roomote-app-image: &roomote-app-image ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-roocodeinc}/roomote-app:${ROOMOTE_VERSION:?ROOMOTE_VERSION is required}

x-roomote-base-env: &roomote-base-env
  NODE_ENV: production
  # Dual-write APP_ENV / ROOMOTE_* aliases keep the previous release bootable
  # against this expand-window compose file during upgrade compatibility.
  R_APP_ENV: ${R_APP_ENV:-${APP_ENV:-production}}
  APP_ENV: ${R_APP_ENV:-${APP_ENV:-production}}
  ROOMOTE_DOCKER_LOAD_ENV_FILE: 'false'
  HOST: 0.0.0.0
  R_APP_URL: https://${ROOMOTE_APP_DOMAIN:?ROOMOTE_APP_DOMAIN is required}
  ROOMOTE_APP_URL: https://${ROOMOTE_APP_DOMAIN:?ROOMOTE_APP_DOMAIN is required}
  R_PUBLIC_URL: https://${ROOMOTE_APP_DOMAIN:?ROOMOTE_APP_DOMAIN is required}
  ROOMOTE_PUBLIC_URL: https://${ROOMOTE_APP_DOMAIN:?ROOMOTE_APP_DOMAIN is required}
  R_INSTANCE_ID: ${R_INSTANCE_ID:-}
  TRPC_URL: ${TRPC_URL:-https://${ROOMOTE_APP_DOMAIN:?ROOMOTE_APP_DOMAIN is required}/_roomote-api}
  # Azure Container Apps sandbox provider. In the base anchor so controller,
  # api, and bullmq all see it — credentials can also come from the
  # DB-persisted setup values instead of process env.
  AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
  AZURE_RESOURCE_GROUP: ${AZURE_RESOURCE_GROUP:-}
  AZURE_SANDBOX_GROUP: ${AZURE_SANDBOX_GROUP:-}
  AZURE_SANDBOX_REGION: ${AZURE_SANDBOX_REGION:-}
  AZURE_SANDBOX_DISK_IMAGE: ${AZURE_SANDBOX_DISK_IMAGE:-}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
  AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
  AZURE_SANDBOX_REGISTRY_USERNAME: ${AZURE_SANDBOX_REGISTRY_USERNAME:-}
  AZURE_SANDBOX_REGISTRY_TOKEN: ${AZURE_SANDBOX_REGISTRY_TOKEN:-}
  AZURE_SANDBOX_SIZE: ${AZURE_SANDBOX_SIZE:-}
  AZURE_SANDBOX_EGRESS_INSPECTION: ${AZURE_SANDBOX_EGRESS_INSPECTION:-}
  AZURE_HTTP_DEBUG: ${AZURE_HTTP_DEBUG:-}

