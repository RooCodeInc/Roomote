x-roomote-service: &roomote-service
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17-trixie@sha256:137f044b0efe3d57f39b972b9b53641b1f2045b99d879e298bbf514a25787dcf
    profiles:
      - local-postgres
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomote-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-roomote}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-roomote}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    command: server /data --console-address ':9001'

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: 'no'
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-roomote}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET_ARTIFACTS: ${S3_BUCKET_ARTIFACTS:-roomote-artifacts}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        until mc alias set roomote http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 1
        done
        mc mb --ignore-existing "roomote/$$S3_BUCKET_ARTIFACTS"

  # The only service with the host Docker socket. Its API is reachable solely
  # from the controller and bullmq over an internal network, and all unrelated
  # Docker API sections remain denied by the proxy defaults.
  docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=4m,mode=755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: '1'
      ALLOW_START: '1'
      EXEC: '1'
      IMAGES: '1'
      NETWORKS: '1'
      VOLUMES: '1'
      POST: '1'
      EVENTS: '0'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]

  db-migrate:
    <<: *roomote-service
    image: *roomote-app-image
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    command: ['db-migrate']
    environment:
      ROOMOTE_SERVICE: db-migrate
      NODE_ENV: production
      R_APP_ENV: ${R_APP_ENV:-${APP_ENV:-production}}
      APP_ENV: ${R_APP_ENV:-${APP_ENV:-production}}
      ROOMOTE_DOCKER_LOAD_ENV_FILE: 'false'
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:roomote-postgres-password@postgres:5432/roomote}

  web:
    <<: *roomote-service
    image: *roomote-app-image
    command: ['web']
    depends_on:
      api:
        condition: service_started
    environment:
      <<: *roomote-web-env
      ROOMOTE_SERVICE: web
      PORT: 3000
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /roomote/apps/web/.next/cache:rw,noexec,nosuid,nodev,size=128m,uid=10000,gid=10000,mode=700
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS --max-time 2 http://127.0.0.1:3000/health >/dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  api:
    <<: *roomote-service
    image: *roomote-app-image
    command: ['api']
    # Reachable from task worker containers (worker -> API over TRPC_URL).
    networks: [default, worker]
    depends_on:
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *roomote-api-env
      ROOMOTE_SERVICE: api
      PORT: 3001
    volumes:
      - gbrain_data:/gbrain-data:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS --max-time 2 http://127.0.0.1:3001/health/liveness >/dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  controller:
    <<: *roomote-service
    image: *roomote-app-image
    command: ['controller']
    # Spawns and reaches task worker containers on the worker network.
    networks: [default, worker, docker-api]
    stop_grace_period: 7m
    depends_on:
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
      docker-proxy:
        condition: service_started
    environment:
      <<: *roomote-controller-env
      ROOMOTE_SERVICE: controller
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS --max-time 5 http://api:3001/health/controller >/dev/null',
        ]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 20s

  bullmq:
    <<: *roomote-service
    image: *roomote-app-image
    command: ['bullmq']
    # Docker standby retention and the settings "Validate environment" checks
    # run here; both reach Docker through the restricted socket proxy, never
    # the raw socket.
    networks: [default, docker-api]
    depends_on:
      redis:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_started
    environment:
      <<: *roomote-bullmq-env
      ROOMOTE_SERVICE: bullmq
      PORT: 3002
      DOCKER_HOST: tcp://docker-proxy:2375
    volumes:
      - gbrain_data:/gbrain-data:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS --max-time 5 http://127.0.0.1:3002/admin/health >/dev/null',
        ]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 20s

  # Brain (deployment-hosted gbrain). Opt-in via
  # COMPOSE_PROFILES=brain (local-postgres precedent); deployments
  # that never enable the profile see no infrastructure change. Internal-only:
  # no published ports and no Caddy route; the API fronts it at
  # /api/mcp/gbrain. Set GBRAIN_IMAGE to the pinned published image once the
  # publish workflow ships it; until then the installer builds from
  # .docker/gbrain. Wire R_GBRAIN_URL plus static tokens into api/bullmq
  # (operator-pinned), or the normal path: set GBRAIN_ADMIN_BOOTSTRAP_TOKEN
  # (>= 32 chars of [A-Za-z0-9_-]) and paste http://gbrain:8931 plus that
  # same token into Settings > Integrations > Brain; Roomote then
  # registers its own scoped clients via the admin API. If left unset, the
  # entrypoint generates one at /data/admin-bootstrap-token on the volume.
  gbrain:
    profiles:
      - brain
    image: ${GBRAIN_IMAGE:-roomote-gbrain:local}
    restart: unless-stopped
    networks: [default]
    environment:
      GBRAIN_DATABASE_URL: ${DATABASE_URL:-postgres://postgres:roomote-postgres-password@postgres:5432/roomote}
      GBRAIN_ADMIN_BOOTSTRAP_TOKEN: ${GBRAIN_ADMIN_BOOTSTRAP_TOKEN:-}
      # The Brain holds no provider key. It calls back into this deployment,
      # which injects whichever provider key an admin configured in Settings,
      # so rotating or switching that key needs no restart here. Setting a
      # provider key below instead makes the Brain call the provider directly.
      OPENAI_BASE_URL: ${GBRAIN_OPENAI_BASE_URL:-http://api:3001/api/brain/inference}
      OPENAI_API_KEY: ${R_BRAIN_GATEWAY_TOKEN:-}
      GBRAIN_RERANKER_MODEL: ${R_BRAIN_RERANKER_MODEL:-}
      # Create-time, and it has to be the container that receives these: the
      # embedding model and its width are decided when the Brain is created,
      # and the gateway must never substitute a different one afterwards.
      # Set both before the first boot, or neither. The synthesis model is
      # the opposite (R_BRAIN_MODEL, applied by the gateway per request).
      GBRAIN_EMBEDDING_MODEL: ${R_BRAIN_EMBEDDING_MODEL:-}
      GBRAIN_EMBEDDING_DIMENSIONS: ${R_BRAIN_EMBEDDING_DIMENSIONS:-}
    volumes:
      - gbrain_data:/data
    security_opt:
      - no-new-privileges:true

  # Self-run embedding/reranking models for the Brain (opt-in, CPU).
  # Enable with the `local-inference` compose profile. The upstream URLs are
  # NOT sufficient on their own: R_BRAIN_EMBEDDING_MODEL and
  # R_BRAIN_EMBEDDING_DIMENSIONS must name what this server serves (gbrain's
  # defaults name a provider model it does not serve), and the embedding pair
  # is create-time — the full set is documented together in
  # .env.production.example. Serve models by pinned name and keep serving old
  # names: every Brain is locked to its embedding model at creation.
  infinity:
    profiles:
      - local-inference
    image: michaelf34/infinity:0.0.76-cpu@sha256:2a464dcc06e659a277bc841b4be196100489076446482925481b2c5c120fce57
    restart: unless-stopped
    networks: [default]
    environment:
      INFINITY_ANONYMOUS_USAGE_STATS: '0'
      # Standard opt-out honored by Infinity (and many other tools); keeps
      # the stack quiet even if the Infinity-specific variable is renamed.
      DO_NOT_TRACK: '1'
    command:
      - v2
      - --device
      - cpu
      - --url-prefix
      - /v1
      - --port
      - '7997'
      # Multilingual defaults: memories arrive in whatever language the
      # workspace speaks, and cross-lingual recall (an English query hitting
      # a German Slack thread) needs a multilingual embedding space. On a
      # smaller CPU host, Alibaba-NLP/gte-multilingual-base (768 dims) is a
      # lighter alternative with close retrieval quality — pick before the
      # Brain's first boot; the embedding choice is create-time.
      - --model-id
      - ${INFINITY_EMBEDDING_MODEL:-BAAI/bge-m3}
      - --model-id
      - ${INFINITY_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
    volumes:
      - infinity_cache:/app/.cache
    security_opt:
      - no-new-privileges:true

  preview-proxy:
    <<: *roomote-service
    image: *roomote-app-image
    command: ['preview-proxy']
    # Proxies preview traffic into task worker containers.
    networks: [default, worker]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *roomote-preview-proxy-env
      ROOMOTE_SERVICE: preview-proxy
      PORT: 8081
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS --max-time 2 http://127.0.0.1:8081/health >/dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      preview-proxy:
        condition: service_healthy
    environment:
      ROOMOTE_APP_DOMAIN: ${ROOMOTE_APP_DOMAIN:?ROOMOTE_APP_DOMAIN is required}
      ROOMOTE_PREVIEW_DOMAIN: ${ROOMOTE_PREVIEW_DOMAIN:?ROOMOTE_PREVIEW_DOMAIN is required}
      ROOMOTE_CADDY_LOCAL_CERTS: ${ROOMOTE_CADDY_LOCAL_CERTS:-}
      ROOMOTE_CADDY_WILDCARD_TLS_SNIPPET: ${ROOMOTE_CADDY_WILDCARD_TLS_SNIPPET-import roomote_on_demand_wildcard_tls}
      S3_BUCKET_ARTIFACTS: ${S3_BUCKET_ARTIFACTS:-roomote-artifacts}
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  gbrain_data:
  infinity_cache:

networks:
  default:
    name: roomote_default
    driver: bridge
  # Task worker containers join only this network. It carries the API,
  # controller, and preview-proxy — everything a task needs to reach — but
  # not Postgres, Redis, or MinIO, so a task sandbox cannot reach the
  # datastores directly.
  worker:
    name: roomote_worker
    driver: bridge
  # No published ports and no route to application/datastore networks. Only
  # the controller and the socket proxy join this network.
  docker-api:
    name: roomote_docker_api
    driver: bridge
    internal: true
