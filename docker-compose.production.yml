name: roomote

x-roomote-production-env: &roomote-production-env
  NODE_ENV: production
  APP_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-https://${ROOMOTE_APP_DOMAIN:?ROOMOTE_APP_DOMAIN is required}}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
  S3_BUCKET_ARTIFACTS: ${S3_BUCKET_ARTIFACTS:-roomote-artifacts}
  JOB_AUTH_PRIVATE_KEY: ${JOB_AUTH_PRIVATE_KEY:?JOB_AUTH_PRIVATE_KEY is required}
  JOB_AUTH_PUBLIC_KEY: ${JOB_AUTH_PUBLIC_KEY:?JOB_AUTH_PUBLIC_KEY is required}
  PREVIEW_AUTH_PRIVATE_KEY: ${PREVIEW_AUTH_PRIVATE_KEY:?PREVIEW_AUTH_PRIVATE_KEY is required}
  PREVIEW_AUTH_PUBLIC_KEY: ${PREVIEW_AUTH_PUBLIC_KEY:?PREVIEW_AUTH_PUBLIC_KEY is required}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
  ARTIFACT_SIGNING_KEY: ${ARTIFACT_SIGNING_KEY:?ARTIFACT_SIGNING_KEY is required}
  ARTIFACT_SIGNING_KEY_PREVIOUS: ${ARTIFACT_SIGNING_KEY_PREVIOUS:-}
  DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?DASHBOARD_PASSWORD is required}
  ROOMOTE_APP_URL: https://${ROOMOTE_APP_DOMAIN:?ROOMOTE_APP_DOMAIN is required}
  ROOMOTE_PUBLIC_URL: https://${ROOMOTE_APP_DOMAIN:?ROOMOTE_APP_DOMAIN is required}
  TRPC_URL: http://api:3001
  PREVIEW_PROXY_BASE_URL: https://${ROOMOTE_PREVIEW_DOMAIN:?ROOMOTE_PREVIEW_DOMAIN is required}
  NEXT_PUBLIC_PREVIEW_PROXY_BASE_URL: https://${ROOMOTE_PREVIEW_DOMAIN:?ROOMOTE_PREVIEW_DOMAIN is required}
  PREVIEW_DOMAINS: ${ROOMOTE_PREVIEW_DOMAIN:?ROOMOTE_PREVIEW_DOMAIN is required}
  ROOMOTE_ALLOWED_EMAILS: ${ROOMOTE_ALLOWED_EMAILS:-}
  ROOMOTE_AUTH_SLACK_CLIENT_ID: ${ROOMOTE_AUTH_SLACK_CLIENT_ID:-}
  ROOMOTE_AUTH_SLACK_CLIENT_SECRET: ${ROOMOTE_AUTH_SLACK_CLIENT_SECRET:-}
  ROOMOTE_MODEL: ${ROOMOTE_MODEL:-}
  ROOMOTE_SMALL_MODEL: ${ROOMOTE_SMALL_MODEL:-}
  ROOMOTE_VISION_MODEL: ${ROOMOTE_VISION_MODEL:-}
  ROOMOTE_CODE_REVIEW_MODEL: ${ROOMOTE_CODE_REVIEW_MODEL:-}
  ROOMOTE_EXPLORE_MODEL: ${ROOMOTE_EXPLORE_MODEL:-}
  ROOMOTE_MODEL_ENV_KEYS: ${ROOMOTE_MODEL_ENV_KEYS:-}
  CUSTOM_PROVIDER_API_KEY: ${CUSTOM_PROVIDER_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
  AWS_REGION: ${AWS_REGION:-}
  GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
  GOOGLE_VERTEX_PROJECT: ${GOOGLE_VERTEX_PROJECT:-}
  GOOGLE_VERTEX_LOCATION: ${GOOGLE_VERTEX_LOCATION:-}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
  MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
  OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
  BASETEN_API_KEY: ${BASETEN_API_KEY:-}
  TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
  NEXT_PUBLIC_GITHUB_APP_SLUG: ${NEXT_PUBLIC_GITHUB_APP_SLUG:?NEXT_PUBLIC_GITHUB_APP_SLUG is required}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  SLACK_APP_ID: ${SLACK_APP_ID:-}
  SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
  SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
  SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  LINEAR_CLIENT_ID: ${LINEAR_CLIENT_ID:-}
  LINEAR_CLIENT_SECRET: ${LINEAR_CLIENT_SECRET:-}
  LINEAR_WEBHOOK_SECRET: ${LINEAR_WEBHOOK_SECRET:-}
  DEFAULT_COMPUTE_PROVIDER: ${DEFAULT_COMPUTE_PROVIDER:?DEFAULT_COMPUTE_PROVIDER is required}
  MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
  MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
  MODAL_ENDPOINT: ${MODAL_ENDPOINT:-}
  MODAL_ENVIRONMENT: ${MODAL_ENVIRONMENT:-}
  MODAL_APP_NAME: ${MODAL_APP_NAME:-}
  MODAL_BASE_IMAGE_REF: ${MODAL_BASE_IMAGE_REF:-}
  MODAL_ECR_OIDC_ROLE_ARN: ${MODAL_ECR_OIDC_ROLE_ARN:-}
  MODAL_ECR_REGION: ${MODAL_ECR_REGION:-}

x-roomote-production-build-args: &roomote-production-build-args
  APP_ENV: production
  RELEASE_VERSION: ${RELEASE_VERSION:-self-host-production}

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  minio:
    ports: !reset []

  db-migrate:
    build:
      args:
        <<: *roomote-production-build-args
    environment:
      <<: *roomote-production-env

  web:
    environment:
      <<: *roomote-production-env
    ports: !reset []

  api:
    environment:
      <<: *roomote-production-env
    ports: !reset []

  controller:
    environment:
      <<: *roomote-production-env

  bullmq:
    environment:
      <<: *roomote-production-env
    ports: !reset []

  preview-proxy:
    environment:
      <<: *roomote-production-env
    ports: !reset []

  caddy:
    image: caddy:2.10-alpine
    container_name: roomote-caddy
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      preview-proxy:
        condition: service_started
    environment:
      ROOMOTE_APP_DOMAIN: ${ROOMOTE_APP_DOMAIN:?ROOMOTE_APP_DOMAIN is required}
      ROOMOTE_PREVIEW_DOMAIN: ${ROOMOTE_PREVIEW_DOMAIN:?ROOMOTE_PREVIEW_DOMAIN is required}
      S3_BUCKET_ARTIFACTS: ${S3_BUCKET_ARTIFACTS:-roomote-artifacts}
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
