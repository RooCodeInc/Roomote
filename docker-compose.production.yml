  BOX_STANDBY_MAX_COUNT: ${BOX_STANDBY_MAX_COUNT:-25}
  BOX_STANDBY_MAX_AGE_HOURS: ${BOX_STANDBY_MAX_AGE_HOURS:-168}
  AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
  AZURE_RESOURCE_GROUP: ${AZURE_RESOURCE_GROUP:-}
  AZURE_SANDBOX_GROUP: ${AZURE_SANDBOX_GROUP:-}
  AZURE_SANDBOX_REGION: ${AZURE_SANDBOX_REGION:-}
  AZURE_SANDBOX_DISK_IMAGE: ${AZURE_SANDBOX_DISK_IMAGE:-}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
  AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
  AZURE_SANDBOX_REGISTRY_USERNAME: ${AZURE_SANDBOX_REGISTRY_USERNAME:-}
  AZURE_SANDBOX_REGISTRY_TOKEN: ${AZURE_SANDBOX_REGISTRY_TOKEN:-}
  AZURE_SANDBOX_SIZE: ${AZURE_SANDBOX_SIZE:-}
  AZURE_SANDBOX_EGRESS_INSPECTION: ${AZURE_SANDBOX_EGRESS_INSPECTION:-}
  AZURE_HTTP_DEBUG: ${AZURE_HTTP_DEBUG:-}
  DOCKER_STANDBY_MAX_COUNT: ${DOCKER_STANDBY_MAX_COUNT:-10}
  DOCKER_STANDBY_MAX_AGE_HOURS: ${DOCKER_STANDBY_MAX_AGE_HOURS:-24}

x-roomote-production-build-args: &roomote-production-build-args
  R_APP_ENV: production
  RELEASE_VERSION: ${RELEASE_VERSION:-self-host-production}
  RELEASE_PRODUCT_VERSION: ${RELEASE_PRODUCT_VERSION:-}

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  minio:
    ports: !reset []

  db-migrate:
    build:
      args:
        <<: *roomote-production-build-args
    environment:
      <<: *roomote-production-env

  web:
    environment:
      <<: *roomote-production-env
    ports: !reset []
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS --max-time 2 http://127.0.0.1:3000/health >/dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  api:
    environment:
      <<: *roomote-production-env
    ports: !reset []
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS --max-time 2 http://127.0.0.1:3001/health/liveness >/dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  controller:
    environment:
      <<: *roomote-production-env
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS --max-time 5 http://api:3001/health/controller >/dev/null',
        ]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 20s

  bullmq:
    environment:
      <<: *roomote-production-env
    ports: !reset []
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS --max-time 5 http://127.0.0.1:3002/admin/health >/dev/null',
        ]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 20s

  preview-proxy:
    environment:
      <<: *roomote-production-env
    ports: !reset []
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS --max-time 2 http://127.0.0.1:8081/health >/dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    container_name: roomote-caddy
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      preview-proxy:
        condition: service_healthy
    environment:
      ROOMOTE_APP_DOMAIN: ${ROOMOTE_APP_DOMAIN:?ROOMOTE_APP_DOMAIN is required}
      ROOMOTE_PREVIEW_DOMAIN: ${ROOMOTE_PREVIEW_DOMAIN:?ROOMOTE_PREVIEW_DOMAIN is required}
      S3_BUCKET_ARTIFACTS: ${S3_BUCKET_ARTIFACTS:-roomote-artifacts}
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
