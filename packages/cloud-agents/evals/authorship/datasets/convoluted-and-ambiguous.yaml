    authorshipInstructions: |
      1. For GitHub-started tasks in acme/frontend, keep Roomote as the author and assign PRs to Alice Nguyen.
      2. For human-created Slack tasks in acme/backend, keep the matched human as the author and assign PRs to Bruno Bergher.
    availableRepositoriesKey: standard
    availableUsersKey: brunoAlice
    expected:
      exactRuleCount: 2
      maxErrorCount: 0
      expectedRules:
        - authorMode: roomote
          prOwnerMode: specific_user
          prOwnerGithubLogin: alice-nguyen
          sourceKinds:
            - github
          repositoryFullNames:
            - acme/frontend
        - authorMode: matched_human
          prOwnerMode: specific_user
          prOwnerGithubLogin: brunobergher
          sourceKinds:
            - slack
          repositoryFullNames:
            - acme/backend
          humanCreated: true
  assert:
    - type: javascript
      value: file://assertions/authorship-assertions.ts:isValidAuthorshipJson
    - type: javascript
      value: file://assertions/authorship-assertions.ts:matchesExpectedAuthorshipResult

