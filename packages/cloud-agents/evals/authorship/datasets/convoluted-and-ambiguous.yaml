# Authorship guidance evals for concrete, convoluted, and ambiguous rules.

- description: 'Authorship - GitHub work can stay Roomote and unassigned'
  vars:
    authorshipInstructions: |
      For GitHub-started tasks of type github.pr.review in Roomote/example-app, keep Roomote as the author and leave the PR unassigned.
    availableRepositoriesKey: standard
    availableUsersKey: defaultWithSam
    expected:
      exactRuleCount: 1
      maxErrorCount: 0
      expectedRules:
        - authorMode: roomote
          prOwnerMode: none
          sourceKinds:
            - github
          taskTypes:
            - github.pr.review
          repositoryFullNames:
            - Roomote/example-app
  assert:
    - type: javascript
      value: file://assertions/authorship-assertions.ts:isValidAuthorshipJson
    - type: javascript
      value: file://assertions/authorship-assertions.ts:matchesExpectedAuthorshipResult

- description: 'Authorship - Slack human-created backend work assigns Bruno to author and PR owner'
  vars:
    authorshipInstructions: |
      For human-created Slack tasks in acme/backend, make Bruno Bergher both the author and the PR owner.
    availableRepositoriesKey: standard
    availableUsersKey: brunoAlice
    expected:
      exactRuleCount: 1
      maxErrorCount: 0
      expectedRules:
        - authorMode: specific_user
          authorGithubLogin: brunobergher
          prOwnerMode: specific_user
          prOwnerGithubLogin: brunobergher
          sourceKinds:
            - slack
          repositoryFullNames:
            - acme/backend
          humanCreated: true
  assert:
    - type: javascript
      value: file://assertions/authorship-assertions.ts:isValidAuthorshipJson
    - type: javascript
      value: file://assertions/authorship-assertions.ts:matchesExpectedAuthorshipResult

