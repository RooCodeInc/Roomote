- description: "Roomote task URL should not trigger external lookup"
  vars:
    context: |
      **Task Description**:
      @Roomote why did my task https://app.roomote.dev/task/1ca3bto5tjhy7 fall asleep in the middle of a workflow?

      **Source**: Slack
      **Channel**: #operations

      **Available Agents**:
      - Explainer [id: agent-explainer-1]

      **Available Repositories**:
      - Roomote/example-app: Roomote app and agent runtime

      **Available Environments**:
      - App: Main Roomote product (repos: Roomote/example-app)
  assert:
    - type: javascript
      value: file://assertions/routing-assertions.ts:isValidRoutingJson
    - type: javascript
      value: |
        return (() => {
          const payload =
            output.match(/```(?:json)?\s*([\s\S]*?)```/)?.[1] ??
            output.match(/\{[\s\S]*\}/)?.[0];
          if (!payload) return false;
          const parsed = JSON.parse(payload.trim());
          return parsed.needsExternalLookup === false;
        })();
    - type: javascript
      value: |
        return (() => {
          const payload =
            output.match(/```(?:json)?\s*([\s\S]*?)```/)?.[1] ??
            output.match(/\{[\s\S]*\}/)?.[0];
          if (!payload) return false;
          const parsed = JSON.parse(payload.trim());
          return parsed.externalReference === null;
        })();

