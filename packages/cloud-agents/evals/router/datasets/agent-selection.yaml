# Agent Selection test cases for LLM routing evaluation
# These cover mixed intent signals, implicit/explicit keywords, context-dependent selection

- description: "Mixed intent - fix and explain"
  vars:
    context: |
      **Task Description**:
      Fix the memory leak in the worker pool and explain what was causing it so we can prevent similar issues.

      **Source**: Slack
      **Channel**: #backend-team

      **Available Agents**:
      - Coder [id: agent-coder-1]
      - Explainer [id: agent-explainer-1]
      - Planner [id: agent-planner-1]

      **Available Repositories**:
      - fintech/worker-service: Background job processing service
      - fintech/monitoring: Metrics and alerting

      **Available Environments**:
      - Worker Platform: Job processing and monitoring (repos: fintech/worker-service, fintech/monitoring)
    expectedWorkspaceValue: "fintech/worker-service"
    expectedAgentId: "agent-coder-1"
  assert:
    - type: javascript
      value: file://assertions/routing-assertions.ts:isValidRoutingJson
    # Primary intent is to fix, so Coder should be selected
    - type: javascript
      value: file://assertions/routing-assertions.ts:workspaceValueMatchesExpected

