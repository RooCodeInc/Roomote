# Basic test cases for LLM routing evaluation
# These cover the fundamental routing scenarios

- description: 'Clear coding task with explicit repository'
  vars:
    context: |
      **Task Description**:
      Fix the bug in the authentication flow where users are being logged out unexpectedly after 5 minutes.

      **Source**: Slack
      **Channel**: #backend-team

      **Available Agents**:
      - Coder [id: agent-coder-1]
      - Explainer [id: agent-explainer-1]
      - Planner [id: agent-planner-1]

      **Available Repositories**:
      - acme/auth-service: Authentication microservice handling user sessions
      - acme/api-gateway: API gateway for routing requests
      - acme/user-service: User management and profiles

      **Available Environments**:
      - Auth Platform: Core authentication services (repos: acme/auth-service, acme/api-gateway)
      - User Accounts: User profile stack (repos: acme/user-service)
    expectedAgentId: 'agent-coder-1'
  assert:
    - type: javascript
      value: file://assertions/routing-assertions.ts:isValidRoutingJson
    - type: javascript
      value: file://assertions/routing-assertions.ts:hasValidKickoffMessage

