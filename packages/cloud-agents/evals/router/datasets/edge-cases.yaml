# Edge Cases test cases for LLM routing evaluation
# These cover minimal input, long descriptions, special characters, and ambiguous scenarios

- description: "Very short task - two words"
  vars:
    context: |
      **Task Description**:
      fix bug

      **Source**: Slack
      **Channel**: #dev

      **Available Agents**:
      - Coder [id: agent-coder-1]
      - Explainer [id: agent-explainer-1]

      **Available Repositories**:
      - company/main-app: Primary application
    expectedAgentId: "agent-coder-1"
  assert:
    - type: javascript
      value: file://assertions/routing-assertions.ts:isValidRoutingJson
    # Should still route despite minimal input

- description: "Very short task - single word"
  vars:
    context: |
      **Task Description**:
      help

      **Source**: Slack
      **Channel**: #general

      **Available Agents**:
      - Coder [id: agent-coder-1]
      - Explainer [id: agent-explainer-1]

      **Available Repositories**:
      - org/project: Main project
  assert:
    - type: javascript
      value: file://assertions/routing-assertions.ts:isValidRoutingJson
    - type: javascript
