- description: "Very long task description - detailed requirements"
  vars:
    context: |
      **Task Description**:
      We need to implement a comprehensive user authentication system that supports multiple authentication providers including Google OAuth 2.0, GitHub OAuth, and traditional email/password authentication. The system should include the following features: secure password hashing using bcrypt with a minimum of 12 rounds, JWT token generation with configurable expiration times (default 1 hour for access tokens, 7 days for refresh tokens), rate limiting on login attempts (max 5 failed attempts per 15 minutes), account lockout after 10 consecutive failed attempts with email notification to the user, two-factor authentication support using TOTP (Time-based One-Time Password) compatible with Google Authenticator and similar apps, session management with the ability to view and revoke active sessions, password reset flow with time-limited tokens (valid for 1 hour), email verification for new accounts, remember me functionality with extended session duration, and comprehensive audit logging of all authentication events including IP address, user agent, and geolocation data. The implementation should follow OWASP security guidelines and be compatible with GDPR requirements for data handling and user consent. Please ensure all sensitive data is encrypted at rest and in transit, and implement proper CORS configuration for the frontend integration. The authentication service should expose a RESTful API with OpenAPI documentation and include comprehensive error handling with meaningful error messages that don't leak sensitive information.

      **Source**: Linear
      **Issue**: AUTH-001 - Authentication System Implementation
      **Project**: Security Infrastructure
      **Team**: Platform Security

      **Available Agents**:
      - Coder [id: agent-coder-1]
      - Explainer [id: agent-explainer-1]
      - Planner [id: agent-planner-1]

      **Available Repositories**:
      - platform/auth-service: Authentication microservice
      - platform/user-service: User management
      - platform/gateway: API gateway

      **Available Environments**:
      - Platform Services: Auth, user, and gateway services (repos: platform/auth-service, platform/user-service, platform/gateway)
    expectedWorkspaceValue: "platform/auth-service"
    expectedAgentId: "agent-coder-1"
  assert:
    - type: javascript
      value: file://assertions/routing-assertions.ts:isValidRoutingJson
    # "implement" is the key action verb
    - type: javascript
      value: file://assertions/routing-assertions.ts:workspaceValueMatchesExpected

