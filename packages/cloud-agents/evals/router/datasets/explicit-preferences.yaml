# Negative agent overrides — user rejects one agent in favor of another
- description: "Negative override - don't use Coder, use Explainer"
  vars:
    context: |
      **Task Description**:
      Don't use Coder for this. Have Explainer review the login flow instead.

      **Source**: Slack
      **Channel**: #engineering

      **Available Agents**:
      - Coder [id: agent-coder-1]
      - Explainer [id: agent-explainer-1]
      - Planner [id: agent-planner-1]

      **Available Repositories**:
      - acme/auth: Authentication service
      - acme/frontend: React frontend

      **Available Environments**:
      - Web App: Auth and frontend (repos: acme/auth, acme/frontend)
    expectedAgentId: "agent-explainer-1"
  assert:
    - type: javascript
      value: file://assertions/routing-assertions.ts:isValidRoutingJson
    # User explicitly rejected Coder and named Explainer

- description: "Negative override - not Explainer, want Coder to fix"
