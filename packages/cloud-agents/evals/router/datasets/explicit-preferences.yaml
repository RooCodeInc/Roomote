# Explicit user preference test cases for LLM routing evaluation
# These ensure the router respects clear user instructions about which
# agent or workspace to use, even when task keywords might suggest otherwise.
# CLO-900: "If the user tells us what they want fairly explicitly, that we follow it."

- description: "User explicitly names agent type - Coder"
  vars:
    context: |
      **Task Description**:
      I want Coder to look into the reporting module and tell me how it works.

      **Source**: Slack
      **Channel**: #engineering

      **Available Agents**:
      - Coder [id: agent-coder-1]
      - Explainer [id: agent-explainer-1]
      - Planner [id: agent-planner-1]

      **Available Repositories**:
      - acme/reporting: Reporting and export management
      - acme/api: Main API service

      **Available Environments**:
      - Backend Services: Reporting and API (repos: acme/reporting, acme/api)
    expectedAgentId: "agent-coder-1"
  assert:
    - type: javascript
      value: file://assertions/routing-assertions.ts:isValidRoutingJson
    # User explicitly said "Use Coder" - should override Explainer keywords

