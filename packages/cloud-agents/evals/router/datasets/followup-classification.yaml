# ─── Edge Cases ────────────────────────────────────────────────────────────────

- description: "Edge - 'no' with instructions is correction not cancellation"
  vars:
    suggestedAgentName: Coder
    suggestedWorkspace: acme/frontend
    userResponse: "no, use acme/backend"
  assert:
    - type: javascript
      value: file://assertions/followup-assertions.ts:isValidFollowUpJson
    # "no" + instruction = correct, NOT cancel
    - type: javascript
      value: file://assertions/followup-assertions.ts:intentEqualsCorrect

- description: "Edge - 'nah' with different request is correction"
  vars:
    suggestedAgentName: Explainer
    suggestedWorkspace: acme/api
    userResponse: "nah, have Coder fix it instead"
  assert:
    - type: javascript
      value: file://assertions/followup-assertions.ts:isValidFollowUpJson
    - type: javascript
      value: file://assertions/followup-assertions.ts:intentEqualsCorrect

- description: "Edge - 'stop' is cancellation"
  vars:
    suggestedAgentName: Coder
    suggestedWorkspace: acme/frontend
    userResponse: "stop"
  assert:
    - type: javascript
      value: file://assertions/followup-assertions.ts:isValidFollowUpJson
    - type: javascript
      value: file://assertions/followup-assertions.ts:intentEqualsCancel

- description: "Edge - 'ok' is confirmation"
  vars:
    suggestedAgentName: Coder
    suggestedWorkspace: acme/api
    userResponse: "ok"
  assert:
    - type: javascript
      value: file://assertions/followup-assertions.ts:isValidFollowUpJson
    - type: javascript
      value: file://assertions/followup-assertions.ts:intentEqualsConfirm

- description: "Edge - thumbs down is cancellation"
  vars:
    suggestedAgentName: Planner
    suggestedWorkspace: acme/frontend
    userResponse: "👎"
  assert:
    - type: javascript
      value: file://assertions/followup-assertions.ts:isValidFollowUpJson
    - type: javascript
      value: file://assertions/followup-assertions.ts:intentEqualsCancel

- description: "Edge - ambiguous 'hmm not sure' should not confirm"
  vars:
    suggestedAgentName: Coder
    suggestedWorkspace: acme/frontend
    userResponse: "hmm, not sure about that"
  assert:
    - type: javascript
      value: file://assertions/followup-assertions.ts:isValidFollowUpJson
    # Ambiguous should lean toward correct (safer), definitely not confirm
    - type: javascript
      value: file://assertions/followup-assertions.ts:intentIsNotConfirm

- description: "Edge - 'do it' is confirmation"
  vars:
    suggestedAgentName: Explainer
    suggestedWorkspace: acme/backend
    userResponse: "do it"
  assert:
    - type: javascript
      value: file://assertions/followup-assertions.ts:isValidFollowUpJson
    - type: javascript
      value: file://assertions/followup-assertions.ts:intentEqualsConfirm

