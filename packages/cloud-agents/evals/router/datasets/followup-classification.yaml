# Follow-up classification test cases for routing confirmation flow
# These ensure the classifyFollowUp prompt correctly classifies user responses
# into confirm, cancel, or correct intents.
# CLO-900: Verify-before-confirm routing flow

# ─── Confirm Intent ────────────────────────────────────────────────────────────

- description: "Confirm - simple yes"
  vars:
    suggestedAgentName: Coder
    suggestedWorkspace: acme/frontend
    userResponse: "yes"
  assert:
    - type: javascript
      value: file://assertions/followup-assertions.ts:isValidFollowUpJson
    - type: javascript
      value: file://assertions/followup-assertions.ts:intentEqualsConfirm

- description: "Confirm - go ahead"
  vars:
    suggestedAgentName: Explainer
    suggestedWorkspace: acme/backend
