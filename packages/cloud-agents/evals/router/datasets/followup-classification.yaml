# ─── Cancel Intent ─────────────────────────────────────────────────────────────

- description: "Cancel - bare no (cancel or correct both acceptable)"
  vars:
    suggestedAgentName: Coder
    suggestedWorkspace: acme/frontend
    userResponse: "no"
  assert:
    - type: javascript
      value: file://assertions/followup-assertions.ts:isValidFollowUpJson
    # Bare "no" should ideally be cancel, but the prompt also says
    # "when ambiguous between cancel and correct, prefer correct (safer)".
    # Both are acceptable — the critical safety property is NOT confirming.
    - type: javascript
      value: file://assertions/followup-assertions.ts:intentIsNotConfirm

