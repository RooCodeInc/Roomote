# GitHub Agent Selection test cases for LLM routing evaluation
# These cover the 4-way classification for GitHub-sourced tasks: Fixer, PrReviewer, Explainer, Planner

# --- Fixer cases ---

- description: "GitHub issue - explicit fix request"
  vars:
    context: |
      **Task Description**:
      @roomote fix the login page crash when password is empty

      **Source**: GitHub
      **Repository**: acme-corp/web-frontend
      **Title**: Login page crashes on empty password
      **Comment**: @roomote fix the login page crash when password is empty

      **Available Agents**:
      - Fixer [id: agent-fixer-1]
      - PrReviewer [id: agent-reviewer-1]
      - Explainer [id: agent-explainer-1]
      - Planner [id: agent-planner-1]

      **Available Repositories**:
      - acme-corp/web-frontend: React frontend dashboard
      - acme-corp/api-server: Node.js API backend
      - acme-corp/shared-types: Shared TypeScript types
    expectedAgentId: "agent-fixer-1"
  assert:
    - type: javascript
      value: file://assertions/routing-assertions.ts:isValidRoutingJson

