# Partial correction test cases for LLM routing evaluation
# These ensure the router preserves the uncorrected dimension when the user
# only changes one aspect (agent OR workspace) of a previous suggestion.

- description: "Correction: change agent only, keep workspace"
  vars:
    context: |
      **Task Description**:
      Use Explainer instead

      **Previous Suggestion**: Coder (Coder) working on acme/frontend

      _The user is correcting the workspace suggestion._

      **Source**: Slack
      **Channel**: #engineering

      **Available Agents**:
      - Coder [id: agent-coder-1]
      - Explainer [id: agent-explainer-1]
      - Planner [id: agent-planner-1]

      **Available Repositories**:
      - acme/frontend: React frontend application
      - acme/backend: Node.js backend API
      - acme/mobile: React Native mobile app
    expectedWorkspaceValue: "acme/frontend"
    expectedAgentId: "agent-explainer-1"
  assert:
    - type: javascript
      value: file://assertions/routing-assertions.ts:isValidRoutingJson
    - type: javascript
      value: file://assertions/routing-assertions.ts:hasValidWorkspaceValue
    - type: javascript
      value: file://assertions/routing-assertions.ts:workspaceValueMatchesExpected

