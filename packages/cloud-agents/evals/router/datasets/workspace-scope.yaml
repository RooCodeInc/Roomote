# Open-ended exploration should prefer a matching environment
- description: Open-ended exploration request with matching environment
  vars:
    taskDescription: "What does our authentication flow look like?"
    agents:
      - name: Coder
        type: Coder
        id: agent-coder-1
      - name: Explainer
        type: Explainer
        id: agent-explainer-1
      - name: Planner
        type: Planner
        id: agent-planner-1
    repositories:
      - fullName: acme/frontend
      - fullName: acme/backend
      - fullName: acme/auth-service
    environments:
      - name: Web App
        description: Frontend and backend application
        repositoryNames: [acme/frontend, acme/backend]
    expectedAgentId: "agent-explainer-1"
    expectedWorkspaceValue: "Web App"
  assert:
    - type: javascript
      value: file://assertions/routing-assertions.ts:hasValidWorkspaceValue
    - type: javascript
      value: file://assertions/routing-assertions.ts:workspaceValueMatchesExpected

# Multi-Repo Without Named Environment - should use all_repositories, NOT environment
- description: Multi-repo task without environment available
  vars:
    context: |
      **Task Description**:
      Update the API types in both frontend and backend to match the new schema.

      **Source**: Slack
      **Channel**: #engineering

      **Available Agents**:
      - Coder [id: agent-coder-1]
      - Explainer [id: agent-explainer-1]
      - Planner [id: agent-planner-1]

      **Available Repositories**:
      - acme/frontend: React frontend application
      - acme/backend: Node.js API server
      - acme/mobile: React Native mobile app
    expectedAgentId: "agent-coder-1"
  assert:
    - type: javascript
      value: file://assertions/routing-assertions.ts:isValidRoutingJson
    - type: javascript
      value: file://assertions/routing-assertions.ts:hasValidWorkspaceValue
    - type: javascript
      value: file://assertions/routing-assertions.ts:hasValidWorkspaceValue

- description: Multi-repo task - environment available and matching
  vars:
    context: |
      **Task Description**:
      Implement the new search feature across both the UI and API.

      **Source**: Linear
      **Issue**: FEAT-300 - Search feature
      **Team**: Product

      **Available Agents**:
      - Coder [id: agent-coder-1]
      - Explainer [id: agent-explainer-1]
      - Planner [id: agent-planner-1]

      **Available Repositories**:
      - acme/frontend: React frontend application
      - acme/backend: Node.js API server

      **Available Environments**:
      - Full Stack Dev: Full-stack development environment (repos: acme/frontend, acme/backend)
    expectedWorkspaceValue: "Full Stack Dev"
    expectedAgentId: "agent-coder-1"
  assert:
    - type: javascript
      value: file://assertions/routing-assertions.ts:isValidRoutingJson
    # When an environment covers the needed repos, prefer environment over all_repositories
    - type: javascript
      value: file://assertions/routing-assertions.ts:hasValidWorkspaceValue
    - type: javascript
      value: file://assertions/routing-assertions.ts:workspaceValueMatchesExpected

- description: Environment config schema change should prefer environment over all repositories
  vars:
    context: |
      **Task Description**:
      Similar to how we added per-environment MCPs, can we also add an optional list of skill names to the environment config that correspond to entries from https://skills.sh/ installable with npx skills add <name>, and then install them as part of environment setup

      **Source**: Linear
      **Issue**: ARCH-912 - Environment skills support
      **Team**: Platform

      **Available Agents**:
      - Coder [id: agent-coder-1]
      - Explainer [id: agent-explainer-1]
      - Planner [id: agent-planner-1]

      **Available Repositories**:
      - roomote/cloud-agents: Routing and environment setup orchestration
      - roomote/worker: Task runtime execution
      - roomote/web: User-facing dashboard

      **Available Environments**:
      - Cloud Agents Platform: Environment config and setup pipeline (repos: roomote/cloud-agents, roomote/worker)
      - Product Web: Dashboard and frontend workflows (repos: roomote/web)
    expectedWorkspaceValue: "Cloud Agents Platform"
  assert:
    - type: javascript
      value: file://assertions/routing-assertions.ts:isValidRoutingJson
    - type: javascript
      value: file://assertions/routing-assertions.ts:hasValidWorkspaceValue
    - type: javascript
      value: file://assertions/routing-assertions.ts:workspaceValueMatchesExpected
