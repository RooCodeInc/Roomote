# Specific Repository - Clear Match
- description: Specific repo - explicit mention
  vars:
    taskDescription: "Fix the login bug in the backend service"
    agents:
      - name: Coder
        type: Coder
        id: agent-coder-1
      - name: Explainer
        type: Explainer
        id: agent-explainer-1
    repositories:
      - fullName: acme/backend
        description: Node.js API server with auth
      - fullName: acme/frontend
        description: React frontend
    environments:
      - name: Full Stack Dev
        description: Frontend and backend development
        repositoryNames: [acme/frontend, acme/backend]
    expectedWorkspaceValue: acme/backend
  assert:
    - type: javascript
      value: file://assertions/routing-assertions.ts:hasValidWorkspaceValue
    - type: javascript
      value: file://assertions/routing-assertions.ts:workspaceValueMatchesExpected

