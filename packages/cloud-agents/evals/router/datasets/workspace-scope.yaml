# Workspace Scope Selection Tests

# All Repositories - Explicit Intent
- description: Explicit all repos - security scan
  vars:
    taskDescription: "Scan all repositories for security vulnerabilities"
    agents:
      - name: Coder
        type: Coder
        id: agent-coder-1
      - name: Explainer
        type: Explainer
        id: agent-explainer-1
      - name: Planner
        type: Planner
        id: agent-planner-1
    repositories:
      - fullName: acme/frontend
        description: React frontend application
      - fullName: acme/backend
        description: Node.js API server
      - fullName: acme/shared-lib
        description: Shared utilities
    environments:
      - name: Full Stack Dev
        description: Frontend and backend development
        repositoryNames: [acme/frontend, acme/backend]
    expectedAgentId: "agent-explainer-1"
  assert:
    - type: javascript
      value: file://assertions/routing-assertions.ts:hasValidWorkspaceValue
    - type: javascript
      value: file://assertions/routing-assertions.ts:hasValidWorkspaceValue

- description: Explicit all repos - codebase-wide refactor
  vars:
    taskDescription: "Update all repos to use our logger instead of console.log"
    agents:
