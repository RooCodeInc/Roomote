    context: |
      **Task Description**:
      Fix the bug in auth-service where password reset tokens expire too quickly.

      **Source**: Slack
      **Channel**: #backend

      **Available Agents**:
      - Coder [id: agent-coder-1]
      - Explainer [id: agent-explainer-1]

      **Available Repositories**:
      - acme/auth-service: Authentication and authorization service
      - acme/user-service: User profile management
      - acme/email-service: Transactional email delivery

      **Available Environments**:
      - Comms Platform: User profiles and email delivery (repos: acme/user-service, acme/email-service)
