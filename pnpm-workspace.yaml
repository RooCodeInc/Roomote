packages:
  - "apps/*"
  - "packages/*"
minimumReleaseAge: 10080
# jose@6.2.4 is the version already pinned in the lockfile; allow
# lockfile-affecting changes while it finishes maturing.
minimumReleaseAgeExclude:
  - jose
  # Allow the patched releases while they finish maturing.
  - brace-expansion
  # Keep the OpenCode SDK aligned with the CLI for the security release.
  - '@opencode-ai/sdk@1.18.32'
blockExoticSubdeps: true
